<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spay360</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
}

.header{
    background:#111;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    letter-spacing:1px;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#2a5298;
}

label{
    font-weight:bold;
    font-size:14px;
}

input{
    width:90%;
    padding:10px;
    margin:8px 0 15px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#2a5298;
    box-shadow:0 0 5px #2a5298;
}

button{
    width:100%;
    padding:12px;
    background:#2a5298;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e3c72;
}

.success{
    background:#e6ffe6;
    color:#008000;
    padding:10px;
    border-radius:6px;
    text-align:center;
    margin-bottom:15px;
    display:none;
}

.admin-box{
    margin-top:30px;
    background:#f4f4f4;
    padding:15px;
    border-radius:10px;
    display:none;
}

.admin-box h3{
    margin-top:0;
    color:#333;
}

.admin-box p{
    margin:5px 0;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    PAYMENT REQUEST 
</div>

<div class="container">
    <h2>Add Money</h2>

    <div class="success" id="successMsg">
        Request Sent To Admin Successfully!
    </div>

    <form id="addMoneyForm">
        <label>Amount</label>
        <input type="number" id="amount" placeholder="Enter Amount" required>

        <label>UTR Number</label>
        <input type="text" id="utr" placeholder="Enter UTR Number" required>

        <label>Upload Screenshot</label>
        <input type="file" id="screenshot" accept="image/*" required>

        <button type="submit">Submit Request</button>
    </form>

    <!-- Admin Demo Panel -->
    <div class="admin-box" id="adminPanel">
        <h3>Admin - New Add Money Request</h3>
        <p><strong>Amount:</strong> <span id="adminAmount"></span></p>
        <p><strong>UTR:</strong> <span id="adminUtr"></span></p>
        <p><strong>Screenshot:</strong></p>
        <img id="adminImage" width="100%" style="border-radius:8px;">
    </div>

</div>

<script>
document.getElementById("addMoneyForm").addEventListener("submit", function(e){
    e.preventDefault();

    let amount = document.getElementById("amount").value;
    let utr = document.getElementById("utr").value;
    let file = document.getElementById("screenshot").files[0];

    if(!file){
        alert("Please upload screenshot");
        return;
    }

    let reader = new FileReader();
    reader.onload = function(){
        document.getElementById("adminAmount").innerText = amount;
        document.getElementById("adminUtr").innerText = utr;
        document.getElementById("adminImage").src = reader.result;

        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("successMsg").style.display = "block";
    }
    reader.readAsDataURL(file);
});
</script>

</body>
</html>
