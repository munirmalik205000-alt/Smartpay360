<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spay360 Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
background: linear-gradient(135deg,#0f172a,#1e293b);
color:white;
min-height:100vh;
}

/* Header */
.top-header{
background: linear-gradient(90deg,#2563eb,#06b6d4);
padding:25px 15px;
text-align:center;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

.top-header h2{
font-size:22px;
letter-spacing:1px;
}

.top-header h3{
margin-top:6px;
font-weight:400;
font-size:16px;
opacity:0.9;
}

/* Main Card */
.main-card{
padding:20px;
}

/* Refer Section */
.refer-card{
background:#1e293b;
padding:18px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.refer-card h3{
margin-bottom:10px;
font-size:17px;
}

.refer-card input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
outline:none;
background:#334155;
color:white;
font-size:14px;
}

.copy-btn{
margin-top:12px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#06b6d4,#3b82f6);
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.copy-btn:hover{
opacity:0.85;
}

/* Wallet Section */
.wallet-section{
background:linear-gradient(135deg,#16a34a,#22c55e);
padding:25px;
border-radius:20px;
text-align:center;
margin-bottom:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.wallet-section h3{
font-weight:400;
}

.wallet-section h1{
font-size:36px;
margin:12px 0;
font-weight:bold;
}

.add-btn{
padding:12px 25px;
border:none;
border-radius:12px;
background:white;
color:#16a34a;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.add-btn:hover{
background:#f1f5f9;
}

/* Services */
.service-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.service-box{
background:#ffffff;
padding:25px 15px;
border-radius:18px;
text-align:center;
text-decoration:none;
color:#2563eb;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
transition:0.3s;
}

.service-box:hover{
transform:translateY(-6px);
background:#334155;
}

.icon{
font-size:30px;
margin-bottom:10px;
}

/* Logout */
.logout-btn{
margin-top:30px;
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ef4444;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.logout-btn:hover{
background:#dc2626;
}

</style>
</head>

<body>

<div class="top-header">
<h2>Welcome To Spay360</h2>
<h2 id="userName">Loading...</h2>
</div>

<div class="main-card">

<div class="refer-card">
<h3>Your Refer Link</h3>
<input type="text" id="referLink" readonly>
<button class="copy-btn" onclick="copyLink()">Copy Link</button>
</div>

<div class="wallet-section">
<h3>Wallet Balance</h3>
<h1>₹ <span id="walletAmount">0</span></h1>
<a href="Addmoney.html">
<button class="add-btn">Add Money</button>
</a>
</div>

<div class="service-grid">

<a href="Recharge.html" class="service-box">
<div class="icon">📱</div>
<p>RECHARGE & BILLS</p>
</a>

<a href="Fundtransfer.html" class="service-box">
<div class="icon">🔄</div>
<p>FUND TRANSFER</p>
</a>

<a href="Myteam.html" class="service-box">
<div class="icon">👥</div>
<p>MY TEAM</p>
</a>

<div class="service-box">
<div class="icon">📋</div>
<p>TRANSACTION</p>
</div>

</div>

<button onclick="logout()" class="logout-btn">Logout</button>

</div>

<!-- 🔥 FIREBASE CONNECTION (UNCHANGED) -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBBANSZWmXo4nHV2DYqy0VNhpxmDCRqzA",
  authDomain: "spay360-bbb00.firebaseapp.com",
  projectId: "spay360-bbb00",
  storageBucket: "spay360-bbb00.firebasestorage.app",
  messagingSenderId: "39260952363",
  appId: "1:39260952363:web:21d6f2a619b51b3f5a576e",
  measurementId: "G-XS5RVGQ2YS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (user) {

    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {

      const data = docSnap.data();

      document.getElementById("userName").innerHTML = data.fullName;
      document.getElementById("walletAmount").innerHTML = data.wallet;

      const referURL = window.location.origin + 
        "/index.html?ref=" + data.referralCode;

      document.getElementById("referLink").value = referURL;
    }

  } else {
    window.location.href = "index.html";
  }

});

window.logout = function(){
  signOut(auth).then(()=>{
    window.location.href="index.html";
  });
}

window.copyLink = function(){
  const copyText = document.getElementById("referLink");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Referral Link Copied!");
}

</script>

</body>
</html>
